name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install tooling
        run: |
          python -m pip install ruff==0.16.5 basedpyright==1.40.2
          curl -fsSL -o shfmt https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          sudo install shfmt /usr/local/bin/

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Basedpyright
        run: |
          mkdir .pycheck
          cp moodle-mcp .pycheck/moodle_mcp.py
          basedpyright --warnings .pycheck

      - name: Shell
        run: |
          shellcheck install .github/bump-version
          shfmt -d -i 4 -ci -bn install .github/bump-version

      - name: Prettier
        run: npx --yes prettier@3.9.6 --check .

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest -v
